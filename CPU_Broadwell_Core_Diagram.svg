<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="680" height="620" fill="#ffffff"/>

  <text x="340" y="34" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Intel Broadwell Core (Xeon E5 v4), simplified</text>

  <!-- Outer core boundary -->
  <rect x="20" y="50" width="640" height="520" rx="8" fill="#f7f7f7" stroke="#333" stroke-width="2"/>

  <!-- Front end -->
  <rect x="40" y="80" width="170" height="50" rx="5" fill="#dbe9f7" stroke="#4a6fa5"/>
  <text x="125" y="102" font-size="12" text-anchor="middle">Fetch +</text>
  <text x="125" y="118" font-size="12" text-anchor="middle">Branch Prediction</text>

  <rect x="230" y="80" width="170" height="50" rx="5" fill="#dbe9f7" stroke="#4a6fa5"/>
  <text x="315" y="102" font-size="12" text-anchor="middle">L1 I-cache</text>
  <text x="315" y="118" font-size="12" text-anchor="middle">32 KB</text>

  <rect x="420" y="80" width="220" height="50" rx="5" fill="#dbe9f7" stroke="#4a6fa5"/>
  <text x="530" y="102" font-size="12" text-anchor="middle">Decode</text>
  <text x="530" y="118" font-size="12" text-anchor="middle">(4 instructions per cycle)</text>

  <!-- Rename / allocate -->
  <rect x="40" y="150" width="600" height="40" rx="5" fill="#c9d9ee" stroke="#4a6fa5"/>
  <text x="340" y="175" font-size="12" text-anchor="middle">Rename and Allocate (micro-op queue, reorder buffer)</text>

  <!-- Scheduler -->
  <rect x="40" y="215" width="600" height="40" rx="5" fill="#c9d9ee" stroke="#4a6fa5"/>
  <text x="340" y="240" font-size="12" text-anchor="middle">Unified Scheduler (out-of-order issue)</text>

  <!-- Execution ports -->
  <rect x="40" y="280" width="80" height="70" rx="4" fill="#f2c18d" stroke="#b0773a"/>
  <text x="80" y="308" font-size="11" text-anchor="middle">P0</text>
  <text x="80" y="324" font-size="10" text-anchor="middle">FMA, ALU</text>

  <rect x="126" y="280" width="80" height="70" rx="4" fill="#f2c18d" stroke="#b0773a"/>
  <text x="166" y="308" font-size="11" text-anchor="middle">P1</text>
  <text x="166" y="324" font-size="10" text-anchor="middle">FMA, ALU</text>

  <rect x="212" y="280" width="80" height="70" rx="4" fill="#f2c18d" stroke="#b0773a"/>
  <text x="252" y="308" font-size="11" text-anchor="middle">P5</text>
  <text x="252" y="324" font-size="10" text-anchor="middle">ALU, shuffle</text>

  <rect x="298" y="280" width="80" height="70" rx="4" fill="#f2c18d" stroke="#b0773a"/>
  <text x="338" y="308" font-size="11" text-anchor="middle">P2 / P3</text>
  <text x="338" y="324" font-size="10" text-anchor="middle">Load address</text>

  <rect x="384" y="280" width="80" height="70" rx="4" fill="#f2c18d" stroke="#b0773a"/>
  <text x="424" y="308" font-size="11" text-anchor="middle">P4</text>
  <text x="424" y="324" font-size="10" text-anchor="middle">Store data</text>

  <rect x="470" y="280" width="80" height="70" rx="4" fill="#f2c18d" stroke="#b0773a"/>
  <text x="510" y="308" font-size="11" text-anchor="middle">P6</text>
  <text x="510" y="324" font-size="10" text-anchor="middle">ALU, branch</text>

  <rect x="556" y="280" width="80" height="70" rx="4" fill="#f2c18d" stroke="#b0773a"/>
  <text x="596" y="308" font-size="11" text-anchor="middle">P7</text>
  <text x="596" y="324" font-size="10" text-anchor="middle">Store address</text>

  <!-- Data cache -->
  <rect x="40" y="375" width="280" height="50" rx="5" fill="#dff0e0" stroke="#3f7d4a"/>
  <text x="180" y="397" font-size="12" text-anchor="middle">L1 D-cache: 32 KB</text>
  <text x="180" y="414" font-size="11" text-anchor="middle">(load and store data)</text>

  <rect x="340" y="375" width="300" height="50" rx="5" fill="#dff0e0" stroke="#3f7d4a"/>
  <text x="490" y="397" font-size="12" text-anchor="middle">L2 cache: 256 KB</text>
  <text x="490" y="414" font-size="11" text-anchor="middle">(private to this core)</text>

  <!-- Shared L3 and DRAM -->
  <rect x="40" y="445" width="600" height="40" rx="5" fill="#e8e0f5" stroke="#6b4fa0"/>
  <text x="340" y="470" font-size="12" text-anchor="middle">Shared L3 cache (up to 55 MiB per socket)</text>

  <rect x="40" y="505" width="600" height="35" rx="5" fill="#fbe3e3" stroke="#a04040"/>
  <text x="340" y="527" font-size="12" text-anchor="middle">DRAM (main memory)</text>

  <!-- Connections -->
  <line x1="210" y1="105" x2="230" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="105" x2="420" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="130" x2="530" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="190" x2="340" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="255" x2="340" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="338" y1="350" x2="200" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="180" y1="425" x2="180" y2="445" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="425" x2="490" y2="445" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="485" x2="340" y2="505" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="340" y="594" font-size="12" text-anchor="middle" fill="#333">Simplified. 2 FMA units (ports 0 and 1) give 32 FP32 FLOPs per cycle with AVX2.</text>
  <text x="340" y="610" font-size="11" text-anchor="middle" fill="#555">Original drawing based on Intel Broadwell microarchitecture (Intel Optimization Reference Manual). Cache sizes from Colab lscpu.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
