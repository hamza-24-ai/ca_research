<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>

  <text x="330" y="36" font-size="17" font-weight="bold" fill="#222">NVIDIA Turing Streaming Multiprocessor (SM), Tesla T4</text>

  <!-- Outer SM boundary -->
  <rect x="20" y="50" width="600" height="500" rx="8" fill="#f7f7f7" stroke="#333" stroke-width="2"/>

  <!-- Four processing blocks -->
  <g>
    <rect x="40" y="90" width="270" height="185" rx="6" fill="#eef4fb" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="175" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Processing Block 0</text>
    <rect x="55" y="116" width="240" height="26" rx="3" fill="#c9d9ee" stroke="#4a6fa5"/>
    <text x="175" y="134" font-size="12" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="55" y="150" width="240" height="38" rx="3" fill="#8fb3e0" stroke="#4a6fa5"/>
    <text x="175" y="173" font-size="12" text-anchor="middle">16 x FP32 cores</text>
    <rect x="55" y="196" width="240" height="38" rx="3" fill="#8fb3e0" stroke="#4a6fa5"/>
    <text x="175" y="219" font-size="12" text-anchor="middle">16 x INT32 cores</text>
    <rect x="55" y="242" width="115" height="26" rx="3" fill="#f2c18d" stroke="#b0773a"/>
    <text x="112" y="260" font-size="11" text-anchor="middle">2 x Tensor Core</text>
    <rect x="180" y="242" width="115" height="26" rx="3" fill="#d9d9d9" stroke="#777"/>
    <text x="237" y="260" font-size="11" text-anchor="middle">SFU / LD/ST</text>
  </g>

  <g>
    <rect x="330" y="90" width="270" height="185" rx="6" fill="#eef4fb" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="465" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Processing Block 1</text>
    <rect x="345" y="116" width="240" height="26" rx="3" fill="#c9d9ee" stroke="#4a6fa5"/>
    <text x="465" y="134" font-size="12" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="345" y="150" width="240" height="38" rx="3" fill="#8fb3e0" stroke="#4a6fa5"/>
    <text x="465" y="173" font-size="12" text-anchor="middle">16 x FP32 cores</text>
    <rect x="345" y="196" width="240" height="38" rx="3" fill="#8fb3e0" stroke="#4a6fa5"/>
    <text x="465" y="219" font-size="12" text-anchor="middle">16 x INT32 cores</text>
    <rect x="345" y="242" width="115" height="26" rx="3" fill="#f2c18d" stroke="#b0773a"/>
    <text x="402" y="260" font-size="11" text-anchor="middle">2 x Tensor Core</text>
    <rect x="470" y="242" width="115" height="26" rx="3" fill="#d9d9d9" stroke="#777"/>
    <text x="527" y="260" font-size="11" text-anchor="middle">SFU / LD/ST</text>
  </g>

  <g>
    <rect x="40" y="295" width="270" height="185" rx="6" fill="#eef4fb" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="175" y="313" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Processing Block 2</text>
    <rect x="55" y="321" width="240" height="26" rx="3" fill="#c9d9ee" stroke="#4a6fa5"/>
    <text x="175" y="339" font-size="12" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="55" y="355" width="240" height="38" rx="3" fill="#8fb3e0" stroke="#4a6fa5"/>
    <text x="175" y="378" font-size="12" text-anchor="middle">16 x FP32 cores</text>
    <rect x="55" y="401" width="240" height="38" rx="3" fill="#8fb3e0" stroke="#4a6fa5"/>
    <text x="175" y="424" font-size="12" text-anchor="middle">16 x INT32 cores</text>
    <rect x="55" y="447" width="115" height="26" rx="3" fill="#f2c18d" stroke="#b0773a"/>
    <text x="112" y="465" font-size="11" text-anchor="middle">2 x Tensor Core</text>
    <rect x="180" y="447" width="115" height="26" rx="3" fill="#d9d9d9" stroke="#777"/>
    <text x="237" y="465" font-size="11" text-anchor="middle">SFU / LD/ST</text>
  </g>

  <g>
    <rect x="330" y="295" width="270" height="185" rx="6" fill="#eef4fb" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="465" y="313" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Processing Block 3</text>
    <rect x="345" y="321" width="240" height="26" rx="3" fill="#c9d9ee" stroke="#4a6fa5"/>
    <text x="465" y="339" font-size="12" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="345" y="355" width="240" height="38" rx="3" fill="#8fb3e0" stroke="#4a6fa5"/>
    <text x="465" y="378" font-size="12" text-anchor="middle">16 x FP32 cores</text>
    <rect x="345" y="401" width="240" height="38" rx="3" fill="#8fb3e0" stroke="#4a6fa5"/>
    <text x="465" y="424" font-size="12" text-anchor="middle">16 x INT32 cores</text>
    <rect x="345" y="447" width="115" height="26" rx="3" fill="#f2c18d" stroke="#b0773a"/>
    <text x="402" y="465" font-size="11" text-anchor="middle">2 x Tensor Core</text>
    <rect x="470" y="447" width="115" height="26" rx="3" fill="#d9d9d9" stroke="#777"/>
    <text x="527" y="465" font-size="11" text-anchor="middle">SFU / LD/ST</text>
  </g>

  <!-- Shared memory bars -->
  <rect x="40" y="500" width="270" height="30" rx="3" fill="#e8e0f5" stroke="#6b4fa0"/>
  <text x="175" y="520" font-size="12" text-anchor="middle">Register File: 256 KB</text>
  <rect x="330" y="500" width="270" height="30" rx="3" fill="#e8e0f5" stroke="#6b4fa0"/>
  <text x="465" y="520" font-size="12" text-anchor="middle">L1 / Shared Memory: 96 KB</text>

  <!-- Chip-level blocks -->
  <rect x="680" y="90" width="200" height="60" rx="6" fill="#dff0e0" stroke="#3f7d4a" stroke-width="1.5"/>
  <text x="780" y="115" font-size="13" font-weight="bold" text-anchor="middle">L2 Cache: 4 MB</text>
  <text x="780" y="134" font-size="11" text-anchor="middle">shared by all 40 SMs</text>

  <rect x="680" y="250" width="200" height="70" rx="6" fill="#fbe3e3" stroke="#a04040" stroke-width="1.5"/>
  <text x="780" y="276" font-size="13" font-weight="bold" text-anchor="middle">GDDR6 Memory: 16 GB</text>
  <text x="780" y="296" font-size="11" text-anchor="middle">320 GB/s bandwidth</text>

  <rect x="680" y="400" width="200" height="60" rx="6" fill="#e6e6e6" stroke="#555" stroke-width="1.5"/>
  <text x="780" y="425" font-size="13" font-weight="bold" text-anchor="middle">Host CPU + System</text>
  <text x="780" y="444" font-size="11" text-anchor="middle">PCIe Gen3 x16</text>

  <!-- Connections -->
  <line x1="620" y1="120" x2="680" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="150" x2="780" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="320" x2="780" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="450" y="580" font-size="12" text-anchor="middle" fill="#333">Per SM (Turing, T4): 64 FP32 + 64 INT32 cores, 8 Tensor Cores, 256 KB register file, 96 KB L1/shared. T4 has 40 SMs.</text>
  <text x="450" y="596" font-size="11" text-anchor="middle" fill="#555">Original drawing based on NVIDIA Turing GPU Architecture Whitepaper (2018), Table 5 and SM description. Texture units and RT cores omitted.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
